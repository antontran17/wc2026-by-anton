<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Manchester United - Red Devils</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="https://a.espncdn.com/i/teamlogos/soccer/500/360.png">
    <link rel="apple-touch-icon" href="https://a.espncdn.com/i/teamlogos/soccer/500/360.png">
</head>
<body>

    <!-- Preloader -->
    <div id="preloader">
        <div class="preloader-content">
            <img src="red-devil.png" alt="Red Devil" class="preloader-logo">
            <h1 class="preloader-text"><span class="glory-text">GLORY GLORY</span><br><span class="mu-text">MAN UNITED</span></h1>
        </div>
    </div>

    <header id="header">
        <div class="container">
            <div class="header-inner">
                <a href="#" class="logo">
                    <img src="https://a.espncdn.com/i/teamlogos/soccer/500/360.png" alt="MU Logo">
                    <span>MANCHESTER UNITED</span>
                </a>
                <div class="hamburger" id="hamburger">
                    <i class="fas fa-bars"></i>
                </div>
                <nav class="nav-links" id="nav-links">
                    <a href="#matches" class="active">LỊCH THI ĐẤU</a>
                    <a href="#standings">BẢNG XẾP HẠNG</a>
                    <a href="#squad">ĐỘI HÌNH</a>
                </nav>
            </div>
        </div>
    </header>

    <main>
        <!-- Hero Section -->
        <section class="hero" id="hero">
            <div class="hero-bg"></div>
            <div class="container">
                <div class="hero-content">
                    <h1>GLORY GLORY<br><span class="highlight">MAN UNITED</span></h1>
                    
                </div>
                
                <!-- Next Match Card Container -->
                <div id="next-match-container" class="next-match-wrapper">
                    <!-- Injected by JS -->
                </div>
            </div>
        
            <div class="scroll-down-btn" onclick="document.getElementById('matches').scrollIntoView({behavior: 'smooth'})">
                <i class="fas fa-chevron-down"></i>
            </div>
        </section>

        <!-- Matches Section -->
        <section id="matches" class="section">
            <div class="container">
                <div class="section-header">
                    <h2>LỊCH THI ĐẤU & KẾT QUẢ</h2>
                    <div id="league-filters" class="tabs">
                        <!-- Injected by JS based on available leagues -->
                    </div>
                </div>
                <div id="matches-grid" class="cards-grid">
                    <!-- Injected by JS -->
                    <div class="loading-spinner"><i class="fa-solid fa-spinner fa-spin"></i> Đang tải dữ liệu...</div>
                </div>
            </div>
        </section>

        <!-- Standings Section -->
        <section id="standings" class="section">
            <div class="container">
                <div class="section-header">
                    <h2><span class="hide-mobile">BẢNG XẾP HẠNG</span><span class="show-mobile" style="display:none;">BXH</span> PREMIER LEAGUE</h2>
                </div>
                <div class="table-container">
                    <table class="standings-table">
                        <thead>
                            <tr>
                                <th class="col-pos">#</th>
                                <th class="col-team">Đội bóng</th>
                                <th class="col-pld" title="Số trận">Tr</th>
                                <th class="col-gd" title="Hiệu số">HS</th>
                                <th class="col-pts" title="Điểm">Đ</th>
                                <th class="col-w" title="Thắng">T</th>
                                <th class="col-d" title="Hòa">H</th>
                                <th class="col-l" title="Thua">B</th>
                            </tr>
                        </thead>
                        <tbody id="standings-body">
                            <!-- Injected by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- Squad Section -->
        <section id="squad" class="section">
            <div class="container">
                <div class="section-header">
                    <h2>ĐỘI HÌNH HIỆN TẠI</h2>
                </div>
                <div id="squad-grid" class="squad-grid">
                    <!-- Injected by JS -->
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>Designed and Powered by <a href="https://www.facebook.com/kassleo.AT/" target="_blank" class="author-link">Anton</a></p>
        </div>
    </footer>

    
    
    <!-- Player Modal -->
    <div id="player-modal" class="player-modal-overlay">
        <div class="player-modal-content">
            <button class="close-modal-btn" onclick="closePlayerModal()"><i class="fas fa-times"></i></button>
            <div id="modal-player-details">
                <!-- Injected by JS -->
            </div>
        </div>
    </div>
<!-- Match Modal -->
    <div id="match-modal" class="match-modal-overlay">
        <div class="match-modal-content">
            <button class="close-modal-btn" onclick="closeMatchModal()"><i class="fas fa-times"></i></button>
            <div id="modal-match-details">
                <!-- Injected by JS -->
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
